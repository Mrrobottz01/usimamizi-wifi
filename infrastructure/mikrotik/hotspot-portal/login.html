<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="0; url=https://wifi.swahilicode.tech/p/usimamizi-main?link-login=$(link-login-only)&link-orig=$(link-orig)&mac=$(mac)&ip=$(ip)&error=$(error-esc)">
  <title>Usimamizi Wi-Fi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .portal-card {
      max-width: 380px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .redirect-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      transition: background-color 0.2s;
    }
    .redirect-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
  <script type="text/javascript">
    var dest = "https://wifi.swahilicode.tech/p/usimamizi-main?link-login=" + encodeURIComponent("$(link-login-only)") + "&link-orig=" + encodeURIComponent("$(link-orig)") + "&mac=$(mac)&ip=$(ip)&error=" + encodeURIComponent("$(error-esc)");
    window.location.replace(dest);
  </script>
</head>
<body>
  <div class="portal-card">
    <div class="spinner"></div>
    <h2>Usimamizi Wi-Fi</h2>
    <p>Inafungua ukurasa wa huduma za intaneti...<br><span style="font-size:11px; opacity:0.8;">Loading captive portal...</span></p>
    <a class="redirect-btn" href="https://wifi.swahilicode.tech/p/usimamizi-main?link-login=$(link-login-only)&link-orig=$(link-orig)&mac=$(mac)&ip=$(ip)&error=$(error-esc)">
      Fungua Ukurasa / Open Portal
    </a>
  </div>
</body>
</html>
