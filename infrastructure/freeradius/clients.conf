# FreeRADIUS Clients Configuration
# Defines allowed NAS devices (MikroTik routers) connecting to FreeRADIUS AAA

# MikroTik Uplink Subnet (Airtel Management Network: 192.168.1.0/24)
client mikrotik_uplink {
    ipaddr                          = 192.168.1.0/24
    secret                          = radius_shared_secret_lab
    shortname                       = mikrotik-uplink
    nastype                         = mikrotik
    require_message_authenticator   = true
}

# Physical Lab MikroTik HotSpot Gateway (10.5.50.1)
client mikrotik_hotspot {
    ipaddr                          = 10.5.50.1
    secret                          = radius_shared_secret_lab
    shortname                       = mikrotik-hotspot
    nastype                         = mikrotik
    require_message_authenticator   = true
}

# Localhost client for development verification & test tooling
client localhost {
    ipaddr                          = 127.0.0.1
    secret                          = testing123
    shortname                       = localhost
    require_message_authenticator   = false
}

# Production Remote MikroTik routers connecting via WAN
client mikrotik_remote {
    ipaddr                          = 0.0.0.0/0
    secret                          = radius_shared_secret_lab
    shortname                       = mikrotik-remote
    nastype                         = mikrotik
    require_message_authenticator   = false
}
